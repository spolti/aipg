# Apply in the tenant namespace (ai-tenant-<tenant>), which must have MaasTenantConfig.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: "facebook-opt-125m-subscription"
  namespace: "models-as-a-service"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: "facebook-opt-125m-single"
      namespace: "provider-llm"
      tokenRateLimits:
        - limit: 5400
          window: 10m
