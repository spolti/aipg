apiVersion: v1
kind: ConfigMap
metadata:
  name: facebook-opt-125m-chat-template
data:
  chat-template.jinja: |
    {% for message in messages %}
    {{ message['role'] + ': ' + message['content'] + '\n' }}
    {% endfor %}
    {% if add_generation_prompt %}
    {{ 'assistant: ' }}
    {% endif %}
---
# CPU-only single-node LLMInferenceService for Open Data Hub / OpenShift AI.
# Container named main overrides the default GPU template.
#
#   oc new-project llmisvc-cpu
#   oc apply -f llmisvc-cpu-example.yaml
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: facebook-opt-125m-single
spec:
  model:
    uri: hf://facebook/opt-125m
    name: facebook/opt-125m
  replicas: 1
  router:
    gateway:
      refs:
        - name: red-team
          namespace: openshift-ingress
    route: {}
  template:
    volumes:
      - name: chat-template
        configMap:
          name: facebook-opt-125m-chat-template
    containers:
      - name: main
        image: docker.io/vllm/vllm-openai-cpu:v0.28.0
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --port=8000
          - --served-model-name=facebook/opt-125m
          - --model=/mnt/models
          - --chat-template
          - /tmp/chat-template.jinja
        volumeMounts:
          - name: chat-template
            mountPath: /tmp/chat-template.jinja
            subPath: chat-template.jinja
            readOnly: true
        env:
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: HF_HOME
            value: /tmp
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        ports:
          - name: http
            containerPort: 8000
            protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 10Gi
          requests:
            cpu: "100m"
            memory: 8Gi
        # Override the preset: periodSeconds 1 / timeoutSeconds 1 / HTTPS.
        # This image serves HTTP on 8000; CPU + HF download is slow.
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
