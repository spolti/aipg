# Per-tenant Gateway. Cannot be shared across AITenants.
# hostname: <tenant>-maas.<cluster-domain>
# allowedRoutes label: maas.opendatahub.io/gateway-access-<tenant>=true
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ""
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: ""
    app.kubernetes.io/component: gateway
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ""
  listeners:
    - name: https
      hostname: ""
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              maas.opendatahub.io/gateway-access-TENANT: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: ""
