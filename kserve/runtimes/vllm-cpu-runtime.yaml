# Namespaced ServingRuntime converted from upstream KServe ClusterServingRuntime
# config/runtimes/kserve-vllmserver.yaml, using the CPU image.
#
#   oc apply -f vllm-cpu-runtime.yaml
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-runtime
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: docker.io/vllm/vllm-openai-cpu:v0.23.0
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--served-model-name={{.Name}}"
        - "--model=/mnt/models"
      env:
        - name: HF_HOME
          value: /tmp
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
